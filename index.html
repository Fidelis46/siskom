                    <!-- Filters -->
                    <div class="flex flex-wrap gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
                        <button onclick="filterHardware('all')" class="hw-filter-btn px-3 py-1.5 rounded-lg bg-cyan-500 text-slate-950 font-bold">Semua</button>
                        <button onclick="filterHardware('input')" class="hw-filter-btn px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">Input</button>
                    </div>

            </div>
        </section>
    </main>

    <!-- SCRIPT UTAMA UNTUK MENJALANKAN FUNGSI TOMBOL -->
    <script>
        // 1. Fungsi Switch Tab
        function switchTab(tabId) {
            // Sembunyikan semua tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            
            // Tampilkan tab yang dipilih
            const selectedContent = document.getElementById('content-' + tabId);
            if (selectedContent) {
                selectedContent.classList.remove('hidden');
            }

            // Reset status tombol tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn text-xs sm:text-sm px-4 py-2 rounded-xl font-semibold text-slate-400 hover:text-cyan-300 hover:bg-slate-900/80 transition-all flex items-center space-x-2 whitespace-nowrap";
            });

            // Aktifkan tombol tab yang dipilih
            const activeBtn = document.getElementById('tab-' + tabId);
            if (activeBtn) {
                activeBtn.className = "tab-btn active text-xs sm:text-sm px-4 py-2 rounded-xl font-semibold transition-all flex items-center space-x-2 whitespace-nowrap bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold shadow-lg shadow-cyan-500/20";
            }
        }

        // 2. Fungsi Toggle Audio
        let isAudioOn = true;
        function toggleAudio() {
            isAudioOn = !isAudioOn;
            const icon = document.getElementById('audioIcon');
            const text = document.getElementById('audioStatusText');
            
            if (isAudioOn) {
                icon.className = "fa-solid fa-volume-high text-cyan-400";
                text.textContent = "AUDIO: ON";
            } else {
                icon.className = "fa-solid fa-volume-xmark text-slate-500";
                text.textContent = "AUDIO: OFF";
            }
        }

        // 3. Fungsi Simulasi Von Neumann
        function runVonNeumannSimulation(type) {
            const log = document.getElementById('diagram-log');
            const stepBadge = document.getElementById('diagram-step-badge');
            
            if (type === 'math') {
                log.textContent = "Eksekusi Aritmatika: Memproses 5 + 8 di ALU...";
                stepBadge.textContent = "STEP 1/3";
            } else if (type === 'save') {
                log.textContent = "Menyimpan Data: Mengirim paket data dari RAM ke Storage...";
                stepBadge.textContent = "STEP 1/2";
            } else if (type === 'render') {
                log.textContent = "Tampil Layar: Mengirim sinyal visual ke Output Device...";
                stepBadge.textContent = "STEP 1/2";
            }
        }

        function filterHardware(category) {
